# Every source FrostByte's build downloads, pinned by SHA-256. scripts/stage-fetch.sh downloads
# each into $FROSTBYTE_CACHE/dl/<category>/<file> and refuses anything whose checksum differs.
# Nothing here is vendored: the repository holds only our patches.
#
# <category> <file> <sha256> <url> [<fallback url>...]
#
# Categories:  wpe (WebKit)  deps (libraries in FrostByte.app)  host (tools that run on the build
# host)  toolchain (the cross compiler's sources)  trust (TLS root store)
#
# To bump a package: change the file name, URL and checksum together, rebuild, and update NOTICE
# if its licence changed. `./build.sh fetch` then re-verifies the lot.

