# The Mac OS X 10.5 SDK FrostByte is built against: MacOSX10.5.sdk from Xcode 3.1.4 (9M2809),
# the last Xcode for Leopard on PowerPC. Apple's licence does not allow redistributing it, so the
# build takes it from you (./build.sh --sdk=...). tools/sdk-digest.py computes the digest:
#   sha256 over the sorted `sha256sum` listing of every regular file in the SDK.
