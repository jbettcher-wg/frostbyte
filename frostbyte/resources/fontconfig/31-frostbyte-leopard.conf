<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  FrostByte: fontconfig fixes for the fonts Mac OS X 10.5 ships.

  Installed into <prefix>/etc/fonts/conf.d by deps/build-deps.sh and into the app bundle's
  Resources/etc/fonts/conf.d by tools/package-app.py.

  1. Face weights. FreeType reads no usable weight from several of Leopard's dfont/TrueType faces,
     so fontconfig records the wrong one. The bad case for the web is Helvetica.dfont's Bold face
     (index 1), recorded at weight 80 like Regular: a regular request for "Helvetica" (GitHub,
     and every stack that ends in Helvetica, Arial) tied between Regular and Bold and got Bold,
     and a bold request got the Bold face plus synthetic emboldening on top (Skia reported it as
     weight 400). The same happens to ThonburiBold.ttf, and Hoefler Text, Skia, Apple Chancery and
     Al Bayan read weight 0 (thin) for every face. The rules below run when fontconfig scans a font,
     so the font cache has to be rebuilt after changing them: package-app.py names the bundle's
     cache directory after a hash of the configuration, and an installed prefix needs fc-cache -f.

  2. Mac system font names. Pages ask for -apple-system, BlinkMacSystemFont or system-ui first and
     expect the Mac UI font; on Leopard that is Lucida Grande, with Helvetica Neue as the next
     choice. Without these aliases they failed WebKit's strict family check and fell through.
     (WebKit itself skips -apple-system outright; the alias is here for the other users of this
     configuration. WebKit maps system-ui to the WPE font-name setting, see frostbyte/platform.)
-->
<fontconfig>
	<description>FrostByte: weights and system font names for Mac OS X 10.5's fonts</description>

	<!-- Weight 0 (thin) on a face whose style says nothing about being thin or light: regular. -->
	<match target="scan">
		<test name="weight" compare="eq"><int>0</int></test>
		<test name="style" qual="all" compare="not_contains"><string>thin</string></test>
		<test name="style" qual="all" compare="not_contains"><string>light</string></test>
		<test name="style" qual="all" compare="not_contains"><string>hairline</string></test>
		<edit name="weight" mode="assign"><const>regular</const></edit>
	</match>

	<!-- A "Bold" face recorded lighter than semibold: bold. Semi/Demi/Extra/Ultra bold excluded. -->
	<match target="scan">
		<test name="style" qual="any" compare="contains"><string>bold</string></test>
		<test name="style" qual="all" compare="not_contains"><string>semi</string></test>
		<test name="style" qual="all" compare="not_contains"><string>demi</string></test>
		<test name="style" qual="all" compare="not_contains"><string>extra</string></test>
		<test name="style" qual="all" compare="not_contains"><string>ultra</string></test>
		<test name="weight" compare="less"><const>demibold</const></test>
		<edit name="weight" mode="assign"><const>bold</const></edit>
	</match>

	<!-- A "Black" or "Heavy" face recorded lighter than bold: black. -->
	<match target="scan">
		<test name="style" qual="any" compare="contains"><string>black</string></test>
		<test name="weight" compare="less"><const>bold</const></test>
		<edit name="weight" mode="assign"><const>black</const></edit>
	</match>
	<match target="scan">
		<test name="style" qual="any" compare="contains"><string>heavy</string></test>
		<test name="weight" compare="less"><const>bold</const></test>
		<edit name="weight" mode="assign"><const>heavy</const></edit>
	</match>

	<!-- The Mac system UI font names, and Windows' Segoe UI, as Leopard's UI font. -->
	<alias binding="strong">
		<family>-apple-system</family>
		<prefer><family>Lucida Grande</family><family>Helvetica Neue</family></prefer>
	</alias>
	<alias binding="strong">
		<family>-apple-system-font</family>
		<prefer><family>Lucida Grande</family><family>Helvetica Neue</family></prefer>
	</alias>
	<alias binding="strong">
		<family>BlinkMacSystemFont</family>
		<prefer><family>Lucida Grande</family><family>Helvetica Neue</family></prefer>
	</alias>
	<alias binding="strong">
		<family>system-ui</family>
		<prefer><family>Lucida Grande</family><family>Helvetica Neue</family></prefer>
	</alias>
	<alias binding="strong">
		<family>ui-sans-serif</family>
		<prefer><family>Lucida Grande</family><family>Helvetica Neue</family></prefer>
	</alias>
	<alias binding="strong">
		<family>Segoe UI</family>
		<prefer><family>Lucida Grande</family><family>Helvetica Neue</family></prefer>
	</alias>
</fontconfig>
